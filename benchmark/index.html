<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QL Questionnaire</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f2f5fa; }
    body { margin: 0; padding: 2rem 1rem; }
    main { max-width: 46rem; margin: auto; padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 1rem 3rem #14213d18; }
    h1 { margin-top: 0; }
    .field { display: grid; gap: .35rem; margin: 1rem 0; }
    input, output { box-sizing: border-box; width: 100%; padding: .65rem .75rem; border: 1px solid #aeb9ca; border-radius: .4rem; font: inherit; }
    input[type=checkbox] { width: 1.25rem; height: 1.25rem; }
    output { display: block; min-height: 2.8rem; background: #f4f6fa; }
    .conditional { margin: 1rem 0; padding: .6rem 1rem; border-left: 4px solid #526ee8; background: #f7f8ff; }
    .condition-label { margin: 0; color: #526ee8; font-weight: 600; }
    button { padding: .7rem 1rem; border: 0; border-radius: .4rem; color: white; background: #334fd1; font: inherit; cursor: pointer; }
    #status { min-height: 1.5em; color: #516078; }
    #status.error { color: #b42318; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1 id="form-title">Questionnaire</h1>
    <p>Answers and computed values update as you complete the form.</p>
    <form id="questionnaire"></form>
    <button id="download" type="button">Download answers as JSON</button>
    <p id="status" role="status">Loading…</p>
  </main>
  <script src="./runtime.js"></script>
  <script src="./ui.js"></script>
</body>
</html>
