<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questionnaire</title>
  <style>
    :root { color-scheme: light; font: 16px/1.45 system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    body { max-width: 760px; margin: 3rem auto; padding: 0 1.25rem; }
    main { background: white; border: 1px solid #dce3ee; border-radius: 12px; padding: 2rem; box-shadow: 0 12px 30px #17203312; }
    h1 { margin-top: 0; } .question { display: grid; gap: .45rem; margin: 1.1rem 0; }
    .question input { max-width: 28rem; padding: .6rem; border: 1px solid #aeb9ca; border-radius: 6px; font: inherit; }
    fieldset { margin: 1rem 0; border: 1px solid #aeb9ca; border-radius: 8px; padding: .3rem 1rem; }
    output { font-weight: 650; color: #1d5b3b; } button { padding: .7rem 1rem; border: 0; border-radius: 6px; background: #174ea6; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #123f88; }
  </style>
</head>
<body>
  <main>
    <h1 id="form-title">Questionnaire</h1>
    <form id="questionnaire"></form>
    <button id="download" type="button">Download answers as JSON</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="/ql-core.cjs"></script>
  <script src="/browser.js"></script>
</body>
</html>
